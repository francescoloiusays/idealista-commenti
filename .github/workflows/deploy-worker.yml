name: Deploy Worker

# Avvio manuale da GitHub → Actions → "Deploy Worker" → Run workflow.
# Richiede il secret CLOUDFLARE_API_TOKEN (permesso "Edit Cloudflare Workers")
# e wrangler.toml compilato con database_id e GOOGLE_CLIENT_ID.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        working-directory: worker
        run: node --test test/*.test.js
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
