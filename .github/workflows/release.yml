name: Pacchetto estensione

# Crea lo zip dell'estensione per ogni tag v* (es. v1.0.0) e lo allega alla release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea zip
        run: |
          mkdir -p dist
          cd extension && zip -r ../dist/idealista-commenti-extension.zip . -x '.*'
      - uses: actions/upload-artifact@v4
        with:
          name: idealista-commenti-extension
          path: dist/idealista-commenti-extension.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/idealista-commenti-extension.zip
