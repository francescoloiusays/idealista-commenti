<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Commenti per idealista</title>
  <style>
    :root { --accent: #1b6fd8; --muted: #65676b; --line: #e4e6eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 340px; padding: 16px; color: #1c1e21; background: #fff;
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 22px; height: 22px; }
    .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .user { display: flex; align-items: center; gap: 10px; }
    .user img, .user .ph { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #ddd; flex: none; }
    .user .name { font-weight: 600; }
    .user .sub { color: var(--muted); font-size: 12px; }
    .grow { flex: 1; min-width: 0; }
    button {
      font: inherit; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600;
      background: var(--accent); color: #fff;
    }
    button.ghost { background: #f0f2f5; color: #1c1e21; }
    button:disabled { opacity: .5; cursor: default; }
    label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
    input {
      width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    .msg { font-size: 12px; margin-top: 8px; color: var(--muted); min-height: 16px; }
    .msg.err { color: #c62828; }
    .msg.ok { color: #2e7d32; }
    .id { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); word-break: break-all; }
    details summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  </style>
</head>
<body>
  <h1><img src="icons/icon48.png" alt="" /> Commenti per idealista</h1>

  <div class="card">
    <div class="user" id="user">
      <div class="ph"></div>
      <div class="grow"><div class="name">…</div></div>
    </div>
  </div>

  <div class="card">
    <details id="adv">
      <summary>Impostazioni server</summary>
      <div style="margin-top:10px">
        <label for="api">Indirizzo del Worker</label>
        <input id="api" type="url" placeholder="https://idealista-commenti.tuonome.workers.dev" />
        <div class="row">
          <button id="save">Salva</button>
          <button id="test" class="ghost">Prova connessione</button>
        </div>
        <div class="msg" id="msg"></div>
        <p class="id">ID estensione: <span id="extid"></span></p>
      </div>
    </details>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
